<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Markdown editor with MathJax preview and Markdown/PDF export.">
  <meta name="theme-color" content="#20232e">
  <title>Markdown to Go</title>
  <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/markdown-it.min.js"></script>
  <script defer src="./math-plugin.js"></script>
  <script defer src="./mathjax-config.js"></script>
  <script defer src="./vendor/tex-svg-full.js"></script>
  <script defer src="./vendor/mermaid.tiny.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">m<sup>2</sup><span>Γ</span></span><span>Markdown <strong>to Go</strong></span></div>
    <div class="document-name"><div><input id="filename" value="untitled" aria-label="Document filename" spellcheck="false" maxlength="100"><span>.md</span></div></div>
    <div class="view-switch" role="group" aria-label="Workspace view"><button data-view="edit" aria-pressed="false">Editor</button><button data-view="split" aria-pressed="true">Split</button><button data-view="preview" aria-pressed="false">Preview</button></div>
    <div class="actions">
      <button id="clear-document" class="button tertiary" type="button" title="Clear content and reset the filename">Clear</button>
      <button id="download-md" class="button secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span>Download .md</span></button>
      <button id="download-pdf" class="button primary" disabled title="Opens the browser print dialog; choose Save as PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM17 11h.01"/></svg><span>Export PDF</span></button>
    </div>
    <div class="info">
      <button id="info-button" class="info-button" type="button" aria-label="About document storage" aria-expanded="false" aria-controls="info-panel">?</button>
      <div id="info-panel" class="info-panel" hidden>Document processing runs in your browser. Documents are not stored.</div>
    </div>
  </header>
  <main>
    <section id="workspace" class="workspace" data-view="split" aria-label="Markdown workspace">
      <div class="editor-pane">
        <div class="pane-heading"><label for="editor">MARKDOWN</label></div>
        <textarea id="editor" aria-label="Markdown source" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste your Markdown here…"></textarea>
        <div class="pane-footer"><span id="counts">0 words · 0 characters</span></div>
      </div>
      <div class="preview-pane">
        <div class="pane-heading"><span>LIVE PREVIEW</span><span id="render-status" role="status">Loading MathJax…</span></div>
        <div class="preview-scroll"><article id="preview" class="prose" aria-label="Rendered document"></article></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>This editor needs JavaScript enabled to render Markdown and math.</noscript>
</body>
</html>
